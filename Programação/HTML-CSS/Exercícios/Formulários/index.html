<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulário Completo em HTML</h1>
    
    <!-- Criar o Formulário -->
    <!-- "action" é para onde os dados vão -->
    <!-- "method" é como o formulário vai ser enviado -->
     <form action="/registro" method="POST">

        <!-- inputs = entradas -->
         <label for="nome">Nome:</label>
         <input
         type="text"
         name="nome"
         required
         placeholder="Digite o seu primeiro nome"
         />

         <label for="email">Email:</label>
         <input type="email" name="email" placeholder="Digite o seu email"/>

         <label for="senha">Senha:</label>
         <input type="password" name="senha" placeholder="Digite a sua senha"/>

         <!-- texto mais longo - textarea-->
          <label for="mensagem">Mensagem:</label>
          <textarea
          name="mensagem"
          placeholder="Digite o que vocè achou do sistema...">
        </textarea>

        <!-- formas de seleção -->
        <!-- selecionar algo, quero exibir todas as opções mas so pode selecionar uma. -->
        <h2>Preferências</h2>
        <p>Gênero:</p>

        <input type="radio" name="genero" value="Masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" name="genero" value="Feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" name="genero" value="Outro">
        <label for="outro">Outro</label>

        <!-- pode selecionar uma ou mais -->
         <p>Interesses:</p>

         <input type="checkbox" name="interesses" value="musica">
         <label for="musica">Música</label>

         <input type="checkbox" name="interesses" value="Esporte">
         <label for="esporte">Esporte</label>

         <input type="checkbox" name="interesses" value="Viagem">
         <label for="viagem">Viagem</label>

         <!-- quero esconder as opções e limitar a um -->
          <label for="cidade">Cidade</label>
          <select name="cidade">
            <option value="">Selecione sua cidade</option>
            <option value="São Paulo">São Paulo</option>
            <option value="Lauro de Freitas">Lauro de Freitas</option>
            <option value="Rio de Janeiro">Rio de Janeiro</option>
          </select>

          <!-- tipos HTML5 -->
           <label for="data_nascimento">Data de Nascimento:</label>
           <input type="date" name="data_nascimento" />

           <label for="hora_contato">Selecione o Horário:</label>
           <input type="time" name="hora_contato" />

           <label for="cor">Selecione a Cor:</label>
           <input type="color" name="cor">

          <!-- envio de arquivos -->

          <div>
            <input type="file" name="arquivo" accept=".pdf, .png">
          </div>

          <div>
            <input type="file" name="arquivo" accept=".pdf, .png" multiple>
          </div>

         <!-- botão de ação = submit -->
         <!-- <input type="submit" value="Enviar" /> -->
          <div>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar form</button>
          </div>
     </form>

</body>
</html>
